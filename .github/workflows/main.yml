name: Auto YouTube Stream Timestamp Generator

on:
  schedule:
    # 毎日 朝5:00 JST (UTC 20:00) に自動実行
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  auto-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless yt-dlp

      - name: Run Auto Timestamp Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          AUTO_SECRET: ${{ secrets.AUTO_SECRET }}
        run: |
          python auto_youtube_timestamp.py
