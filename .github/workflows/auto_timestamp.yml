name: Auto YouTube Stream Timestamp Generator

on:
  schedule:
    # 3時間ごとに自動パトロール実行 (全自動)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 手動実行ボタンも配置

jobs:
  auto-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp youtube-transcript-api

      - name: Run Auto Timestamp Generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          AUTO_SECRET: ${{ secrets.AUTO_SECRET }}
        run: |
          python auto_youtube_timestamp.py
